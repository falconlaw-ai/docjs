name: NodeJS package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build-prod
      - run: pnpm test:package
      - run: pnpm exec karma start karma.conf.cjs --single-run --browsers ChromeHeadless
      - run: pnpm test:review
      - run: pnpm example:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:preview
